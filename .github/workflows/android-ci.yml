name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Probar y compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restaurar la firma de actualización
        if: ${{ env.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          keystore_path="$RUNNER_TEMP/vibem3u.keystore"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" \
            | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "VIBEM3U_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Probar y compilar
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            testDebugUnitTest \
            testExperimentalUnitTest testReleaseUnitTest \
            lintDebug lintExperimental lintRelease \
            assembleDebug assembleExperimental assembleRelease

      - name: Verificar firma compatible
        if: ${{ env.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          apksigner_path="$(
            find "$ANDROID_HOME/build-tools" -type f -name apksigner \
              | sort -V | tail -n 1
          )"
          certificate_output="$(
            "$apksigner_path" verify --print-certs \
              app/build/outputs/apk/debug/app-debug.apk 2>&1
          )"
          echo "$certificate_output"
          actual="$(
            printf '%s\n' "$certificate_output" \
              | grep -oE '[0-9a-fA-F]{64}' | head -n 1 | tr 'A-F' 'a-f'
          )"
          expected="ae6457004fe9b72f077439ce882e3913b2429e96dc7285f9d38b435e0f4322b6"
          echo "Certificado SHA-256: $actual"
          test "$actual" = "$expected"

          experimental_output="$(
            "$apksigner_path" verify --print-certs \
              app/build/outputs/apk/experimental/app-experimental.apk 2>&1
          )"
          echo "$experimental_output"
          experimental_actual="$(
            printf '%s\n' "$experimental_output" \
              | grep -oE '[0-9a-fA-F]{64}' | head -n 1 | tr 'A-F' 'a-f'
          )"
          echo "Certificado experimental SHA-256: $experimental_actual"
          test "$experimental_actual" = "$expected"

          release_output="$(
            "$apksigner_path" verify --print-certs \
              app/build/outputs/apk/release/app-release.apk 2>&1
          )"
          echo "$release_output"
          release_actual="$(
            printf '%s\n' "$release_output" \
              | grep -oE '[0-9a-fA-F]{64}' | head -n 1 | tr 'A-F' 'a-f'
          )"
          echo "Certificado release SHA-256: $release_actual"
          test "$release_actual" = "$expected"

      - name: Verificar instalación paralela
        shell: bash
        run: |
          aapt_path="$(
            find "$ANDROID_HOME/build-tools" -type f -name aapt \
              | sort -V | tail -n 1
          )"
          stable_package="$(
            "$aapt_path" dump badging app/build/outputs/apk/debug/app-debug.apk \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"
          experimental_package="$(
            "$aapt_path" dump badging \
              app/build/outputs/apk/experimental/app-experimental.apk \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"
          echo "Paquete estable: $stable_package"
          echo "Paquete experimental: $experimental_package"
          test "$stable_package" = "cl.streambox.tv"
          test "$experimental_package" = "cl.streambox.tv.experimental"

      - name: Publicar APK de la compilación
        uses: actions/upload-artifact@v7
        with:
          name: VibeM3U-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK experimental paralelo
        uses: actions/upload-artifact@v7
        with:
          name: VibeM3U-experimental-${{ github.sha }}
          path: app/build/outputs/apk/experimental/app-experimental.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK release optimizado
        uses: actions/upload-artifact@v7
        with:
          name: VibeM3U-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar reportes de compilación
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: VibeM3U-build-reports-${{ github.sha }}
          path: |
            app/build/test-results
            app/build/reports/tests
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 30

  android-instrumentation:
    name: Verificar persistencia cifrada en Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Preparar fixture de reproducción local
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p app/src/androidTest/assets
          ffmpeg -y -f lavfi -i color=c=blue:s=160x96:r=10 -t 2 \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart -an \
            app/src/androidTest/assets/startup-test.mp4

      - name: Ejecutar prueba Android en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          enable-hw-accel: true
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Publicar reportes instrumentados
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: VibeM3U-instrumentation-reports-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
            app/build/outputs/logs
          if-no-files-found: ignore
          retention-days: 30

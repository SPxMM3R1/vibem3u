name: Publicar APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Compilar y publicar versión
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Comprobar versión de la etiqueta
        shell: bash
        run: |
          version_name="$(
            sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' \
              app/build.gradle.kts
          )"
          echo "Versión del proyecto: $version_name"
          test "v$version_name" = "$GITHUB_REF_NAME"

      - name: Comprobar el secreto de firma
        if: ${{ env.ANDROID_DEBUG_KEYSTORE_BASE64 == '' }}
        shell: bash
        run: |
          echo "Falta el secreto ANDROID_DEBUG_KEYSTORE_BASE64."
          exit 1

      - name: Restaurar la firma de actualización
        shell: bash
        run: |
          keystore_path="$RUNNER_TEMP/vibem3u.keystore"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" \
            | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "VIBEM3U_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Probar y compilar
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            testDebugUnitTest testExperimentalUnitTest testReleaseUnitTest \
            lintDebug lintExperimental lintRelease \
            assembleDebug assembleExperimental assembleRelease

      - name: Verificar firma compatible
        shell: bash
        run: |
          apksigner_path="$(
            find "$ANDROID_HOME/build-tools" -type f -name apksigner \
              | sort -V | tail -n 1
          )"
          certificate_output="$(
            "$apksigner_path" verify --print-certs \
              app/build/outputs/apk/debug/app-debug.apk 2>&1
          )"
          echo "$certificate_output"
          actual="$(
            printf '%s\n' "$certificate_output" \
              | grep -oE '[0-9a-fA-F]{64}' | head -n 1 | tr 'A-F' 'a-f'
          )"
          expected="ae6457004fe9b72f077439ce882e3913b2429e96dc7285f9d38b435e0f4322b6"
          echo "Certificado SHA-256: $actual"
          test "$actual" = "$expected"

          release_output="$(
            "$apksigner_path" verify --print-certs \
              app/build/outputs/apk/release/app-release.apk 2>&1
          )"
          echo "$release_output"
          release_actual="$(
            printf '%s\n' "$release_output" \
              | grep -oE '[0-9a-fA-F]{64}' | head -n 1 | tr 'A-F' 'a-f'
          )"
          echo "Certificado release SHA-256: $release_actual"
          test "$release_actual" = "$expected"

      - name: Preparar el APK
        id: apk
        shell: bash
        run: |
          apk_name="VibeM3U-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk_name"
          echo "name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Conservar el APK como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: VibeM3U-${{ github.ref_name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 90

      - name: Crear o actualizar la versión descargable
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "${{ steps.apk.outputs.name }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${{ steps.apk.outputs.name }}" \
              --verify-tag \
              --title "VibeM3U $version" \
              --generate-notes
          fi

      - name: Publicar reportes de release
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: VibeM3U-release-reports-${{ github.sha }}
          path: |
            app/build/test-results
            app/build/reports/tests
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 90
